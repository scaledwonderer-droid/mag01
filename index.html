<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Housing Magazine Generator</title>
  <meta name="description" content="6枚のハウジングSSと文章から、雑誌風の見開き画像をブラウザだけで作れる編集ツールです。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='12' width='64' height='64' fill='%231c1915'/%3E%3Cpath d='M10 14c10-3 18-1 22 4 4-5 12-7 22-4v36c-10-3-18-1-22 4-4-5-12-7-22-4z' fill='%23f2e4c4' stroke='%23c69b4b' stroke-width='3'/%3E%3Cpath d='M32 18v36' stroke='%23c69b4b' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">M</span><div><strong>Housing Magazine</strong><small>Classic Fantasy Editor</small></div></div>
    <div class="top-actions">
      <button id="undoBtn" title="Ctrl+Z">↶ 元に戻す</button><button id="redoBtn" title="Ctrl+Shift+Z">↷ やり直す</button>
      <button id="newBtn">新規作成</button><button id="saveBtn">プロジェクト保存</button><label class="button">読込<input id="loadProject" type="file" accept="application/json"></label>
      <select id="exportSize" aria-label="出力サイズ"><option value="1500">1500 × 1000</option><option value="3000" selected>3000 × 2000</option><option value="4500">4500 × 3000</option></select>
      <button class="primary" id="exportPng">PNG保存</button>
    </div>
  </header>
  <main class="workspace">
    <aside class="panel">
      <nav class="tabs" aria-label="編集項目">
        <button class="active" data-tab="images">画像</button><button data-tab="text">文章</button><button data-tab="style">スタイル</button><button data-tab="layout">配置</button><button data-tab="export">出力</button>
      </nav>
      <section id="images" class="tab-page active"><div class="section-head"><h2>スクリーンショット</h2><span>枠内ドラッグで位置調整</span></div><div id="imageControls"></div><button id="addImage" class="wide">＋ 自由画像を追加</button><input id="freeImageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden></section>
      <section id="text" class="tab-page"><div class="section-head"><h2>文章</h2><span>入力内容は即時反映</span></div><div id="textControls"></div><button id="addText" class="wide">＋ 自由テキストを追加</button></section>
      <section id="style" class="tab-page"><div class="section-head"><h2>選択中のテキスト</h2><span id="selectionName">未選択</span></div>
        <div class="form-grid"><label>フォント<select id="font"><option value="serif">明朝・セリフ</option><option value="sans-serif">ゴシック</option><option value="Georgia,serif">英文セリフ</option><option value="Arial,sans-serif">英文サンセリフ</option><option value="cursive">手書き風</option></select></label><label>サイズ<input id="fontSize" type="number" min="8" max="180"></label><label>文字色<input id="fontColor" type="color"></label><label>行間<input id="lineHeight" type="number" min="0.8" max="3" step="0.1"></label><label>字間<input id="letterSpacing" type="number" min="-3" max="20" step="0.5"></label><label>揃え<select id="align"><option value="left">左</option><option value="center">中央</option><option value="right">右</option></select></label></div>
        <div class="inline"><button id="boldBtn"><b>B</b></button><button id="italicBtn"><i>I</i></button><button id="deleteSelected" class="danger">削除</button></div>
      </section>
      <section id="layout" class="tab-page"><div class="section-head"><h2>レイアウト</h2><span>文字枠はいつでもドラッグ可能</span></div>
        <label class="switch-row"><span>詳細編集モード</span><input id="detailMode" type="checkbox"></label><label class="switch-row"><span>ガイド表示</span><input id="showGuides" type="checkbox" checked></label><label class="switch-row"><span>グリッド表示</span><input id="showGrid" type="checkbox"></label><label class="switch-row"><span>スナップ</span><input id="snap" type="checkbox" checked></label><label>グリッド間隔<select id="gridSize"><option>10</option><option selected>25</option><option>50</option></select></label>
        <div class="layer-grid"><button data-layer="front">最前面</button><button data-layer="up">前面</button><button data-layer="down">背面</button><button data-layer="back">最背面</button></div>
      </section>
      <section id="export" class="tab-page"><div class="section-head"><h2>保存と出力</h2><span>編集表示は画像に含まれません</span></div>
        <label>画像形式<select id="format"><option value="png">PNG</option><option value="jpeg">JPEG</option></select></label><label>JPEG画質<select id="quality"><option value="0.8">80</option><option value="0.9" selected>90</option><option value="1">100</option></select></label>
        <button id="exportFromTab" class="primary wide">完成画像を書き出す</button><button id="saveFromTab" class="wide">プロジェクトを保存</button>
        <label class="switch-row"><span>非公式表記を完成画像に表示</span><input id="showDisclaimer" type="checkbox" checked></label><p class="privacy">画像・文章は外部へ送信されません。すべてこのブラウザ内で処理されます。</p>
      </section>
    </aside>
    <section class="preview-area">
      <div class="preview-toolbar"><span id="modeBadge">通常編集</span><span id="status">自動保存済み</span><span>文字は滑らかにドラッグ移動・Ctrlを押しながらでスナップ</span></div>
      <div id="canvasWrap"><canvas id="canvas" width="1500" height="1000" aria-label="雑誌見開きプレビュー"></canvas></div>
      <div id="overflowWarning" role="status"></div>
    </section>
  </main>
  <script src="templates/classicFantasy.js"></script>
  <script src="app.js"></script>
</body>
</html>
